name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.17)
        required: true
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version sync
        run: bun run scripts/verify-version-sync.ts

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
